services:
  - type: web
    name: parigi2027
    runtime: static
    buildCommand: ""
    staticPublishPath: pwa
    routes:
      - type: rewrite
        source: /
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
